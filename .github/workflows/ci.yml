name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least-privilege default for GITHUB_TOKEN: jobs that need more declare it themselves.
permissions:
  actions: read
  contents: read

jobs:
  build-and-test:
    # net10.0-windows (Windows Forms) can only build on a Windows runner.
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          # audit, not block: harden-runner >= 2.20 enforces the block on Windows runners too,
          # and the agent's DNS setup failed there on 2026-09-23 ("Could not resolve host: github.com").
          egress-policy: audit
          allowed-endpoints: >
            *.githubapp.com:443
            *.blob.core.windows.net:443
            api.github.com:443
            github.com:22
            github.com:443
            results-receiver.actions.githubusercontent.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: "10.0.x"
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      - run: dotnet test --no-build -c Release

  get-version:
    needs: [build-and-test]
    if: github.event_name == 'push'
    uses: lukislp/lktec-bot/.github/workflows/release.yml@d2e0693df66fa10167181e6c3844cdc2032f4399 # v0.7.2
    with:
      dry-run: true
    secrets:
      app-id: ${{ secrets.LKTEC_BOT_APP_ID }}
      private-key: ${{ secrets.LKTEC_BOT_PRIVATE_KEY }}

  release:
    needs: [get-version]
    if: github.event_name == 'push' && needs.get-version.outputs.released == 'true'
    uses: lukislp/lktec-bot/.github/workflows/release.yml@d2e0693df66fa10167181e6c3844cdc2032f4399 # v0.7.2
    secrets:
      app-id: ${{ secrets.LKTEC_BOT_APP_ID }}
      private-key: ${{ secrets.LKTEC_BOT_PRIVATE_KEY }}

  publish-assets:
    needs: [release]
    if: needs.release.outputs.released == 'true'
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          # audit, not block: harden-runner >= 2.20 enforces the block on Windows runners too,
          # and the agent's DNS setup failed there on 2026-09-23 ("Could not resolve host: github.com").
          egress-policy: audit
          allowed-endpoints: >
            *.githubapp.com:443
            *.blob.core.windows.net:443
            api.github.com:443
            github.com:22
            github.com:443
            registry.npmjs.org:443
            results-receiver.actions.githubusercontent.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.tag }}
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: "10.0.x"
      - name: Publish a self-contained single-file exe and upload it to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.release.outputs.tag }}"
          dotnet publish src/StudyLifeTray/StudyLifeTray.csproj -c Release -r win-x64 --self-contained true \
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true \
            -o publish
          cp publish/StudyLifeTray.exe StudyLifeTray.exe
          sha256sum StudyLifeTray.exe > StudyLifeTray.exe.sha256
          gh release upload "$TAG" StudyLifeTray.exe StudyLifeTray.exe.sha256 --clobber
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Sign the release exe and attach the signature bundle
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release.outputs.tag }}
          # Git Bash on windows-latest auto-converts /-heavy arguments into Windows paths (MSYS
          # path conversion) before they reach cosign.exe - it mangled
          # --certificate-identity-regexp into an unmatchable string (observed: an extra slash
          # inserted before ".github" and "\." turned into "/."). Disabling that conversion for
          # this step is the standard fix; studylife-vscode never hit this because its equivalent
          # job runs on ubuntu-latest, which has no such conversion.
          MSYS_NO_PATHCONV: "1"
        run: |
          cosign sign-blob --yes --bundle StudyLifeTray.exe.sigstore.json StudyLifeTray.exe
          cosign verify-blob --bundle StudyLifeTray.exe.sigstore.json \
            --certificate-identity-regexp '^https://github.com/lukislp/studylife-tray/\.github/workflows/ci\.yml@refs/heads/main$' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com StudyLifeTray.exe
          gh release upload "$TAG" StudyLifeTray.exe.sigstore.json --clobber
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        id: provenance
        with:
          subject-path: StudyLifeTray.exe
      - name: Attach the build provenance to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          cp "${{ steps.provenance.outputs.bundle-path }}" provenance.intoto.jsonl
          gh release upload "$TAG" provenance.intoto.jsonl --clobber
